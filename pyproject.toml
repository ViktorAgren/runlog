[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runlog"
version = "0.1.0"
description = "Extract and locally store running fitness data from Strava and Apple Health."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Viktor Ågren" }]
keywords = [
    "running",
    "strava",
    "apple-health",
    "fitness",
    "gpx",
    "sqlite",
]
dependencies = [
    "requests>=2.31",
    "gpxpy>=1.6",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jinja2>=3.1",
    "anthropic>=0.69",
    "pydantic>=2",
    "fitparse>=1.2",
]

[project.optional-dependencies]
# The JSON API (`runlog serve`); optional so the core install stays light.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    # Gate tools pinned exactly so local and CI never drift: an unpinned linter
    # bump (e.g. a new ruff rule) must be an explicit version change, not a
    # surprise red build.
    "black==26.10.1",
    "mypy==2.4.1",
    "ruff==0.17.5",
    "types-requests>=2.31",
    # The API is type-checked and tested in CI, so its deps belong in dev too
    # (httpx backs fastapi's TestClient).
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
runlog = "runlog.cli:main"

[tool.setuptools.packages.find]
include = ["runlog*"]

[tool.setuptools.package-data]
runlog = ["db/*.sql", "analyze/templates/*.j2"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Verbatim plan-markdown table rows in fixtures are legitimately long.
"runlog/plan/test_schedule.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["runlog"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "seaborn.*", "fitparse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--disable-warnings"
testpaths = ["runlog", "tests"]
